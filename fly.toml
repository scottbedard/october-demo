
app = "october-tenant-example"
primary_region = "dfw"

[build]
  image = "ghcr.io/octobercms/runtime-prod:php85"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  OCTOBER_SCHEDULER_ENABLED = "false"

[http_service]
  internal_port = 80
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/_health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
