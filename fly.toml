# fly.toml app configuration file generated for october-demo on 2026-10-28T20:26:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'october-demo'
primary_region = 'dfw'

[build]
  image = 'ghcr.io/octobercms/runtime-prod:php85'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  OCTOBER_SCHEDULER_ENABLED = 'false'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/_health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
